<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MMAE Companion Widget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Contenedor del Pod Flotante estilo Cristal Oscuro */
    .widget-pod {
      position: relative;
      display: flex;
      align-items: center;
      width: calc(100% - 10px);
      height: calc(100% - 10px);
      background: rgba(15, 18, 26, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 36px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 1px rgba(255, 255, 255, 0.2) inset;
      padding: 6px 10px 6px 6px;
      cursor: grab;
      transition: border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .widget-pod:active {
      cursor: grabbing;
      transform: scale(0.99);
    }

    .widget-pod:hover {
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65), 0 0 1px rgba(255, 255, 255, 0.3) inset;
    }

    /* Caja del personaje Mochi (El cosito blanco de dos ojitos) */
    .mochi-wrapper {
      position: relative;
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .mochi-canvas {
      width: 52px;
      height: 52px;
      display: block;
      pointer-events: none;
    }

    /* Área de información de estado */
    .info-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-left: 10px;
      margin-right: 6px;
      overflow: hidden;
      min-width: 0;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 8px #10B981;
      flex-shrink: 0;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .status-dot.thinking {
      background: #3B82F6;
      box-shadow: 0 0 10px #3B82F6;
      animation: pulseDot 1.4s infinite ease-in-out;
    }

    .status-dot.tool {
      background: #06B6D4;
      box-shadow: 0 0 10px #06B6D4;
      animation: pulseDot 1s infinite ease-in-out;
    }

    .status-dot.error {
      background: #EF4444;
      box-shadow: 0 0 8px #EF4444;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.6; }
    }

    .status-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: #E2E8F0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .action-ticker {
      font-size: 11.5px;
      color: #94A3B8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    /* Botones de acción rápida */
    .controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #E2E8F0;
      border-radius: 14px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-icon {
      width: 24px;
      height: 24px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #94A3B8;
    }

    .btn-icon:hover {
      color: #FFFFFF;
      background: rgba(239, 68, 68, 0.3);
      border-color: rgba(239, 68, 68, 0.5);
    }
  </style>
</head>
<body>

  <div class="widget-pod" id="widgetPod" title="Arrastra para mover • Doble clic para abrir la app">
    <!-- El Cosito Blanco (Mochi con ojitos 3D) -->
    <div class="mochi-wrapper" id="mochiBtn" title="Mochi • Haz clic para acariciar">
      <canvas class="mochi-canvas" id="mochiCanvas" width="104" height="104"></canvas>
    </div>

    <!-- Información en tiempo real de lo que está haciendo -->
    <div class="info-area">
      <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-label" id="statusLabel">Listo</span>
      </div>
      <div class="action-ticker" id="actionTicker">Esperando órdenes • Clic para abrir app</div>
    </div>

    <!-- Controles directos para abrir la app y cerrar -->
    <div class="controls">
      <button class="btn" id="openAppBtn" title="Abrir aplicación principal (JARVIS / Claude)">
        <span>Abrir</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </button>
      <button class="btn btn-icon" id="closeBtn" title="Cerrar widget">✕</button>
    </div>
  </div>

  <script>
    "use strict";

    // ------------------------------------------------------------------
    // 1. MOTOR MATEMÁTICO CANVAS 2D DE MOCHI (El Cosito Blanco de 2 Ojitos)
    // ------------------------------------------------------------------
    var EXP = 2.7;
    var EYE_W = 0.25;
    var EYE_H = 0.27;
    var EYE_SP = 0.37;
    var EYE_P = -0.12;

    function mochiPath(rx, ry) {
      var p = new Path2D();
      var n = 96, e = 2 / EXP;
      for (var i = 0; i <= n; i++) {
        var a = (i / n) * Math.PI * 2;
        var ca = Math.cos(a), sa = Math.sin(a);
        var x = rx * Math.sign(ca) * Math.pow(Math.abs(ca), e);
        var y = ry * Math.sign(sa) * Math.pow(Math.abs(sa), e);
        if (i === 0) p.moveTo(x, y);
        else p.lineTo(x, y);
      }
      p.closePath();
      return p;
    }

    function drawRoundRect(ctx, x, y, w, h, r) {
      var radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function BotEngine() {
      this.yaw = 0;
      this.pitch = 0;
      this.open = 1;
      this.tilt = 0;
      this.sx = 1;
      this.sy = 1;
      this.oy = 0;
      this.ox = 0;
      this.mouth = 0;
      this.state = "idle"; // 'idle' | 'thinking' | 'tool' | 'success' | 'error'

      this.nextBlink = Date.now() + 1500 + Math.random() * 2500;
      this.blinkUntil = 0;
      this.squishUntil = 0;
    }

    BotEngine.prototype.update = function (targetYaw, targetPitch) {
      var now = Date.now();

      // Parpadeo natural
      if (now > this.nextBlink && now > this.blinkUntil) {
        this.blinkUntil = now + 140;
        this.nextBlink = now + 2400 + Math.random() * 3000;
      }
      if (now < this.blinkUntil) {
        this.open = 0.08;
      } else {
        this.open = 1;
      }

      // Animación de caricia / squish al hacer clic
      if (now < this.squishUntil) {
        var progress = (this.squishUntil - now) / 300;
        this.sx = 1 + Math.sin(progress * Math.PI) * 0.25;
        this.sy = 1 - Math.sin(progress * Math.PI) * 0.22;
        this.mouth = Math.sin(progress * Math.PI) * 0.8;
      } else {
        this.sx += (1 - this.sx) * 0.2;
        this.sy += (1 - this.sy) * 0.2;
        this.mouth += (0 - this.mouth) * 0.2;
      }

      // Reacción según el estado de la IA
      if (this.state === "thinking") {
        // Mirar hacia arriba pensativo y balanceo suave
        var t = now / 1000;
        var thinkYaw = Math.sin(t * 1.8) * 0.2;
        var thinkPitch = -0.32 + Math.cos(t * 2.2) * 0.1;
        this.yaw += (thinkYaw - this.yaw) * 0.18;
        this.pitch += (thinkPitch - this.pitch) * 0.18;
        this.tilt = Math.sin(t * 2.5) * 0.08;
      } else if (this.state === "tool") {
        // Mirada enfocada y activa
        var t = now / 1000;
        var toolYaw = Math.sin(t * 3.5) * 0.35;
        var toolPitch = 0.15;
        this.yaw += (toolYaw - this.yaw) * 0.25;
        this.pitch += (toolPitch - this.pitch) * 0.25;
        this.tilt = 0;
      } else {
        // Estado idle: seguir suavemente el cursor o mirar al frente
        if (typeof targetYaw === "number") {
          this.yaw += (targetYaw - this.yaw) * 0.16;
          this.pitch += (targetPitch - this.pitch) * 0.16;
        } else {
          var t = now / 1000;
          var idleYaw = Math.sin(t * 0.8) * 0.15;
          var idlePitch = Math.cos(t * 1.1) * 0.08;
          this.yaw += (idleYaw - this.yaw) * 0.08;
          this.pitch += (idlePitch - this.pitch) * 0.08;
        }
        this.tilt += (0 - this.tilt) * 0.1;
      }

      // Respiración sutil
      var breath = Math.sin((now / 1000) * 2.4);
      this.oy = breath * 0.03;
    };

    BotEngine.prototype.squish = function () {
      this.squishUntil = Date.now() + 300;
    };

    BotEngine.prototype.draw = function (ctx, w, h) {
      var R = w * 0.31;
      var rx = R * 1.15;
      var ry = R * 0.90;
      var cx = w / 2 + this.ox * R;
      var cy = h / 2 + this.oy * R + R * 0.05;

      ctx.save();
      ctx.translate(cx, cy);
      if (this.tilt) ctx.rotate(this.tilt);
      ctx.scale(this.sx, this.sy);

      var path = mochiPath(rx, ry);

      // 1. Cuerpo Blanco con sombreado volumétrico en 3 capas
      var lin = ctx.createLinearGradient(rx * 0.7, -ry * 0.85, -rx * 0.8, ry * 0.9);
      lin.addColorStop(0, "#F5F5F7");
      lin.addColorStop(1, "#C8C9CE");
      ctx.fillStyle = lin;
      ctx.fill(path);

      var shadow = ctx.createRadialGradient(0, 0, R * 0.2, 0, 0, R * 1.25);
      shadow.addColorStop(0, "rgba(0,0,0,0)");
      shadow.addColorStop(0.65, "rgba(0,0,0,0)");
      shadow.addColorStop(1, "rgba(0,0,0,0.18)");
      ctx.fillStyle = shadow;
      ctx.fill(path);

      var spec = ctx.createRadialGradient(rx * 0.35, -ry * 0.45, 0, rx * 0.35, -ry * 0.45, R * 0.45);
      spec.addColorStop(0, "rgba(255,255,255,0.7)");
      spec.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = spec;
      ctx.fill(path);

      // 2. Colorete / Mejillas rosadas
      ctx.save();
      ctx.clip(path);
      var yOffset = Math.sin(this.yaw) * rx * 0.8;
      ctx.fillStyle = "rgba(255, 120, 150, 0.45)";
      for (var sd of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(sd * rx * 0.54 + yOffset, ry * 0.22, R * 0.18, R * 0.10, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // 3. Dos Ojitos esféricos negros con perspectiva 3D
      ctx.save();
      ctx.clip(path);
      for (var side of [-1, 1]) {
        var eyeYaw = side * EYE_SP + this.yaw;
        var eyePitch = EYE_P + this.pitch;
        var cp = Math.cos(eyePitch);
        var visible = Math.cos(eyeYaw) * cp > 0.04;
        if (!visible) continue;

        var ex = Math.sin(eyeYaw) * cp * rx;
        var ey = -Math.sin(eyePitch) * ry;
        var fx = Math.max(0.18, Math.cos(eyeYaw));
        var fy = Math.max(0.18, cp) * this.open;
        var ew = R * EYE_W;
        var eh = R * EYE_H;

        ctx.save();
        ctx.translate(ex, ey);
        ctx.scale(fx, fy);
        ctx.fillStyle = "rgb(24, 20, 22)";
        drawRoundRect(ctx, -ew / 2, -eh / 2, ew, eh, Math.min(ew, eh) / 2);
        ctx.fill();

        // Brillo blanco en cada ojo
        if (this.open > 0.5) {
          ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
          ctx.beginPath();
          ctx.arc(ew * 0.15, -eh * 0.2, ew * 0.18, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
      ctx.restore();

      // 4. Sonrisa cuando se acaricia
      if (this.mouth > 0.05) {
        ctx.save();
        ctx.clip(path);
        ctx.fillStyle = "rgb(40, 25, 25)";
        ctx.beginPath();
        ctx.ellipse(0, ry * 0.25, R * 0.18 * this.mouth, R * 0.14 * this.mouth, 0, 0, Math.PI);
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();
    };

    // ------------------------------------------------------------------
    // 2. INICIALIZACIÓN Y BUCLE DE RENDERIZADO
    // ------------------------------------------------------------------
    var canvas = document.getElementById("mochiCanvas");
    var ctx = canvas.getContext("2d");
    var bot = new BotEngine();
    var cursorYaw = 0;
    var cursorPitch = 0;

    function renderLoop() {
      bot.update(cursorYaw, cursorPitch);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      bot.draw(ctx, canvas.width, canvas.height);
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    // Seguimiento del cursor dentro del widget
    document.addEventListener("mousemove", function (e) {
      var rect = canvas.getBoundingClientRect();
      var cx = rect.left + rect.width / 2;
      var cy = rect.top + rect.height / 2;
      var dx = (e.clientX - cx) / 100;
      var dy = (e.clientY - cy) / 100;
      cursorYaw = Math.max(-0.5, Math.min(0.5, dx));
      cursorPitch = Math.max(-0.4, Math.min(0.4, dy));
    });

    // Clic en Mochi: acariciar / squish
    document.getElementById("mochiBtn").addEventListener("click", function (e) {
      e.stopPropagation();
      bot.squish();
    });

    // ------------------------------------------------------------------
    // 3. COMUNICACIÓN PYWEBVIEW & ACCIONES DEL WIDGET
    // ------------------------------------------------------------------
    function callApi(method, args) {
      if (window.pywebview && window.pywebview.api && typeof window.pywebview.api[method] === "function") {
        try {
          return window.pywebview.api[method](args);
        } catch (err) {
          console.warn("Error invocando " + method + ":", err);
        }
      }
      return Promise.resolve(null);
    }

    // Prevenir que mousedown en botones o en Mochi active el arrastre del pod
    document.querySelectorAll(".controls button, #mochiBtn").forEach(function (el) {
      el.addEventListener("mousedown", function (e) {
        e.stopPropagation();
      });
    });

    // Arrastrar el widget suavemente por la pantalla
    var pod = document.getElementById("widgetPod");
    var isDragging = false;
    var startScreenX = 0;
    var startScreenY = 0;

    pod.addEventListener("mousedown", function (e) {
      if (e.target.closest("button") || e.target.closest("#mochiBtn")) {
        return;
      }
      isDragging = true;
      startScreenX = e.screenX;
      startScreenY = e.screenY;
      document.addEventListener("mousemove", onMouseDrag);
      document.addEventListener("mouseup", onMouseUp);
      callApi("drag_window");
    });

    function onMouseDrag(e) {
      if (!isDragging) return;
      var dx = e.screenX - startScreenX;
      var dy = e.screenY - startScreenY;
      if (Math.abs(dx) > 0 || Math.abs(dy) > 0) {
        startScreenX = e.screenX;
        startScreenY = e.screenY;
        callApi("move_delta", [dx, dy]);
      }
    }

    function onMouseUp(e) {
      isDragging = false;
      document.removeEventListener("mousemove", onMouseDrag);
      document.removeEventListener("mouseup", onMouseUp);
    }

    // Clic en el área de texto / estado o doble clic en el pod: abrir la app
    document.querySelector(".info-area").addEventListener("click", function (e) {
      callApi("open_main");
    });

    pod.addEventListener("dblclick", function (e) {
      if (e.target.closest("button") || e.target.closest("#mochiBtn")) return;
      callApi("open_main");
    });

    // Botón de Abrir App
    document.getElementById("openAppBtn").addEventListener("click", function (e) {
      e.stopPropagation();
      e.preventDefault();
      callApi("open_main");
    });

    // Botón de Cerrar
    document.getElementById("closeBtn").addEventListener("click", function (e) {
      e.stopPropagation();
      e.preventDefault();
      callApi("close_widget");
    });

    // ------------------------------------------------------------------
    // 4. SONDEO DE ESTADO (POLLED REAL-TIME TELEMETRY)
    // ------------------------------------------------------------------
    var statusDot = document.getElementById("statusDot");
    var statusLabel = document.getElementById("statusLabel");
    var actionTicker = document.getElementById("actionTicker");

    function updateWidgetStatus() {
      callApi("get_status").then(function (st) {
        if (!st) return;

        var state = st.state || "idle";
        bot.state = state;

        statusDot.className = "status-dot";
        if (state === "thinking") {
          statusDot.classList.add("thinking");
          statusLabel.textContent = "Pensando...";
        } else if (state === "tool" || st.tool_in_progress) {
          statusDot.classList.add("tool");
          statusLabel.textContent = "Operando";
        } else if (state === "approval") {
          statusDot.classList.add("tool");
          statusLabel.textContent = "Permiso req.";
        } else if (state === "error") {
          statusDot.classList.add("error");
          statusLabel.textContent = "Error";
        } else {
          statusLabel.textContent = "Listo";
        }

        // Ticker de acción
        if (st.running) {
          if (st.tool) {
            var argsTxt = st.tool_args ? (" • " + st.tool_args) : "";
            actionTicker.textContent = st.tool + argsTxt;
          } else if (st.thought) {
            actionTicker.textContent = st.thought;
          } else if (st.task) {
            actionTicker.textContent = st.task;
          } else {
            actionTicker.textContent = "Procesando tarea...";
          }
        } else {
          if (st.thought === "Completado" || st.last_ok === true) {
            actionTicker.textContent = "Tarea completada con éxito • Clic para abrir app";
          } else {
            actionTicker.textContent = "Esperando órdenes • Clic para abrir app";
          }
        }
      }).catch(function () {});
    }

    // Polling ligero cada 400ms (0 CPU, datos en memoria local)
    setInterval(updateWidgetStatus, 400);
    window.addEventListener("pywebviewready", updateWidgetStatus);
  </script>
</body>
</html>
